# provenance.yaml — machine-readable source/verify metadata, one record per
# <service, edition>. This is the authoritative index that tools/verify_index.py
# reconciles against the inline `<!-- VERIFY: ... -->` comments in the text, and
# that (optionally) tools/gen_sources.py renders into SOURCES.md.
#
# status vocabulary (spec §7.1):
#   transcribed          -- authored fresh from an allow-listed source and
#                           verified against a scan.
#   reviewed-unchanged   -- confirmed identical to the parent against a source
#                           (a real, checked "no change this edition").
#   inherited-unreviewed -- inherited (or carried forward) but not yet checked
#                           against a source. A wave is NOT done while any
#                           in-scope cell is inherited-unreviewed.
#
# verify_items: each corresponds 1:1 to an inline `<!-- VERIFY -->` comment in
# the service text. `source_reading` is the exact doubtful reading as printed by
# the source; verify_index.py matches it (normalized) to the inline comment.
#
# NOTE ON SCOPE (Wave 0): the transcribed slice presently covers the opening of
# each service (Morning Prayer through the Venite; Scottish Communion
# exhortation + offertory). Tier-1 depth (spec §3) is the target of Waves 1+.
# These records describe what is transcribed today; `depth: opening-slice` marks
# cells that Waves 1+ will deepen to `depth: tier-1`.

