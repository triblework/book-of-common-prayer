    note: "American 1789; standalone Catechism page (1789/Catechism.htm), NOT bundled with Confirmation. Post-1604 form (with Sacraments). American changes vs 1662: 'My Sponsors in Baptism' (for 'Godfathers and Godmothers'), 'To honour and obey the civil authority' (for 'the King, and all that are put in authority under him'), and 'from our spiritual enemy' (for 'ghostly enemy'). Unlike the English editions, the 1789 catechism page prints its own concluding catechizing rubrics ('The Minister of every Parish shall diligently…') — kept here under ## The Rubrics, as they are not in the separate 1789 confirmation.md. A justus editorial note ('The Catechism text in the 1892 Book is identical…') is dropped as non-liturgical."
