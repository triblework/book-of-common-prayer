# editions.yaml — the ordered genealogy that tools/build_history.py replays.
#
# This file is the single source of truth for the SHAPE of the published
# history: which editions exist, on which branch, descending from which parent,
# under which tag, carrying which services. The TEXT of each service lives under
# editions/<year>/<service>.md (authored/changed here) or is inherited from the
# parent edition (see the inheritance model in the spec §2.4).
#
# Published branches (main, scottish, american) and every vYYYY tag are OUTPUTS
# of the builder. Nobody hand-commits to them. See tools/build_history.py.

# ---------------------------------------------------------------------------
# Build metadata. Timestamps and identity are pinned so the rebuild is fully
# deterministic: same authoring input => identical published trees AND SHAs.
# ---------------------------------------------------------------------------
meta:
  author_name: BCP History Builder
  author_email: build@book-of-common-prayer.local
  # The scaffold commit is stamped at base_date; each subsequent edition commit
  # is stamped one second later, in the topological order listed below.
  base_date: "2026-08-11T00:00:00+00:00"

scaffold:
  branch: main
  commit_message: |
    Scaffold repository structure and tooling

    - Config: .gitattributes (prose diff), .gitignore, MIT LICENSE (code only)
    - Docs: README, CONTRIBUTING, NOTICE (copyright + BCP 1662), SOURCES
    - Tools: build_history.py (history as a build artifact), scrape.py
      (allow-listed, cached, rate-limited), sentence_split.py
      (one-unit-per-line, idempotent), normalize.py (original->normalized,
      deterministic), normalization_rules.yaml (spelling-only rules),
      verify_index.py (inline VERIFY <-> provenance.yaml reconciliation)

# ---------------------------------------------------------------------------
# The genealogy, in topological (build) order. A branch's first edition sets
# `branch_from` to the TAG it is created at; the parent whose materialized tree
# it inherits is `parent`.
#
# Service ids are repo-relative paths WITHOUT the texts/original/ prefix and
# WITHOUT the .md extension, e.g. `daily-office/morning-prayer` resolves to
# texts/original/daily-office/morning-prayer.md in the published tree and to
# editions/<year>/daily-office/morning-prayer.md in this authoring tree.
# ---------------------------------------------------------------------------
editions:
  # ---- English line (main) ----
  - id: 1549
    year: 1549
    branch: main
    parent: null                     # first edition commit after the scaffold
    tag: v1549
    tag_message: "1549 — First Book of Common Prayer (Edward VI)"
    commit_message: "1549 Book of Common Prayer (First Edwardian)"
    present: [daily-office/morning-prayer, daily-office/evening-prayer, the-litany/litany, holy-communion/holy-communion, occasional-offices/public-baptism, occasional-offices/private-baptism, occasional-offices/confirmation, occasional-offices/matrimony, occasional-offices/visitation-sick, occasional-offices/burial, occasional-offices/churching, occasional-offices/commination, occasional-offices/catechism]
